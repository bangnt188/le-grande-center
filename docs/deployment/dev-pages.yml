name: Deploy dev demo to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch pinned private UI submodule
        env:
          UI_SUBMODULE_DEPLOY_KEY: ${{ secrets.UI_SUBMODULE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/legrande-ui-key"
          trap 'rm -f "$key_file"' EXIT
          test -n "$UI_SUBMODULE_DEPLOY_KEY"
          umask 077
          printf '%s\n' "$UI_SUBMODULE_DEPLOY_KEY" > "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/github_known_hosts"
          git submodule init packages/ui
          git config submodule.packages/ui.url git@github.com:bangnt188/component-ui.git
          git submodule update --depth 1 packages/ui
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify admin repository contract
        run: npm run test:admin
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build public demo
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          NEXT_PUBLIC_ADMIN_DEMO: 'true'
          INCLUDE_ADMIN_DEMO: 'true'
          SEO_INDEXABLE: 'false'
        run: npm run build
      - name: Validate demo artifact
        run: |
          test -f out/index.html
          test -f out/admin-preview/index.html
          test -f out/admin-demo/floor-plan.png
          touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
