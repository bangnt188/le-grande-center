name: Shared backend consumer
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.COMPONENT_UI_READ_TOKEN || github.token }}
      - name: Fetch required private submodules
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.COMPONENT_UI_READ_TOKEN || secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUBMODULE_READ_TOKEN" ]; then
            echo "::error::Set COMPONENT_UI_READ_TOKEN or SUBMODULE_READ_TOKEN with read access to both private submodule repositories."
            exit 1
          fi
          git -c "url.https://x-access-token:$SUBMODULE_READ_TOKEN@github.com/.insteadOf=https://github.com/" submodule update --init --recursive --depth=1 -- packages/ui packages/backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:backend
      - run: npm run typecheck:backend
      - run: npm run test:backend
      - run: npm run test:backend:consumer
      - run: node scripts/prepare-backend-handoff.mjs
