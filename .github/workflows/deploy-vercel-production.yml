# Manual-only on main. The app must first be promoted from dev to main.
# Configure GitHub Environment "production" with required reviewers and main-only branch policy.
# Required secrets: COMPONENT_UI_READ_TOKEN (or SUBMODULE_READ_TOKEN), VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Vercel Production environment requires DEPLOY_TARGET=server and NEXT_PUBLIC_SITE_URL
# set to the customer-owned HTTPS root domain. Disable Git-based auto deploy to avoid duplicates.
name: Deploy production to Vercel
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legrande-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN in production environment"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing VERCEL_ORG_ID in production environment"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing VERCEL_PROJECT_ID in production environment"; exit 1; }

      - name: Checkout approved main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout pinned private packages
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.COMPONENT_UI_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUBMODULE_READ_TOKEN" || { echo "::error::Missing read-only private submodule credential"; exit 1; }
          git -c "url.https://x-access-token:$SUBMODULE_READ_TOKEN@github.com/.insteadOf=https://github.com/" submodule update --init --recursive --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run test:admin
          npm run test:scene

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull approved production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production server artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publish approved artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
