# Configure Settings > Pages > Build and deployment > Source: GitHub Actions.
# Secret COMPONENT_UI_READ_TOKEN (or SUBMODULE_READ_TOKEN) must be able to read
# the pinned private repositories bangnt188/component-ui and bangnt188/lib-ts-be.
name: Deploy dev site to GitHub Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legrande-dev-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # COMPONENT_UI_READ_TOKEN is configured as an Environment secret.
    environment: github-pages
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Fetch pinned private submodules
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.COMPONENT_UI_READ_TOKEN || secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUBMODULE_READ_TOKEN" ]; then
            echo "::error::Set COMPONENT_UI_READ_TOKEN or SUBMODULE_READ_TOKEN with read access to both private submodule repositories."
            exit 1
          fi
          git -c "url.https://x-access-token:$SUBMODULE_READ_TOKEN@github.com/.insteadOf=https://github.com/" submodule update --init --recursive --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify public admin demo contract
        run: npm run test:admin

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://bangnt188.github.io/le-grande-center/
          NEXT_PUBLIC_ADMIN_DEMO: 'true'
          INCLUDE_ADMIN_DEMO: 'true'
          SEO_INDEXABLE: 'false'
        run: npm run build:demo

      - name: Validate static export
        run: |
          test -f out/index.html
          test -f out/admin-preview/index.html
          test -f out/admin-demo/floor-plan.png
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dev site
        id: deployment
        uses: actions/deploy-pages@v4
